name: Update profile widgets

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fortune:
    runs-on: ubuntu-latest
    steps:
      - name: Generate a random fortune
        uses: lowlighter/metrics@latest
        with:
          filename: fortune.svg
          token: NOT_NEEDED
          base: ""
          plugin_fortune: yes
          config_timezone: Asia/Seoul
          extras_css: |
            @media (prefers-color-scheme: dark) {
              svg { color: #c9d1d9; }
              h2 { color: #58a6ff !important; }
            }

  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish contribution snake
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
